<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Антиквар</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;600;700&family=Lora:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css?v=9">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <span class="logo__icon" style="font-size: 48px;">⚜</span>
                <h1 class="login-title">Регистрация</h1>
                <p class="login-subtitle">Создайте аккаунт в «Антиквар»</p>
            </div>
            
            {% if error %}
            <div class="alert alert--error">{{ error }}</div>
            {% endif %}
            
            <!-- ВАЖНО: action="/register" и method="POST" -->
            <form class="login-form" method="POST" action="/register">
                
                <!-- ВАЖНО: name="login" (именно login, не username) -->
                <div class="form-group">
                    <label for="login">Логин * (только буквы и цифры)</label>
                    <input type="text" id="login" name="login" placeholder="Например: ivan2026" required>
                </div>
                
                <!-- ВАЖНО: name="name" -->
                <div class="form-group">
                    <label for="name">Ваше имя *</label>
                    <input type="text" id="name" name="name" placeholder="Иван Иванов" required>
                </div>
                
                <!-- ВАЖНО: name="phone" -->
                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input type="tel" id="phone" name="phone" placeholder="+7 (900) 123-45-67">
                </div>
                
                <!-- ВАЖНО: name="password" -->
                <div class="form-group">
                    <label for="password">Пароль * (мин. 6 символов)</label>
                    <input type="password" id="password" name="password" placeholder="Придумайте пароль" required minlength="6">
                </div>
                
                <!-- ВАЖНО: name="password_confirm" -->
                <div class="form-group">
                    <label for="password_confirm">Повторите пароль *</label>
                    <input type="password" id="password_confirm" name="password_confirm" placeholder="Повторите пароль" required minlength="6">
                </div>
                
                <button type="submit" class="login-button">Зарегистрироваться</button>
            </form>
            
            <div class="login-footer">
                <p class="register-link">Уже есть аккаунт? <a href="/login">Войдите!</a></p>
                <p style="margin-top: 15px;"><a href="/">← Вернуться на сайт</a></p>
            </div>
        </div>
    </div>
    
</body>
</html>
